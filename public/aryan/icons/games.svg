<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="0.55" stop-color="#3b54d6"/>
      <stop offset="1" stop-color="#222a78"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.34" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5dae6"/>
    </linearGradient>
    <linearGradient id="dpad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56617c"/>
      <stop offset="1" stop-color="#39415a"/>
    </linearGradient>
  </defs>

  <!-- squircle background + top glow -->
  <rect x="14" y="14" width="484" height="484" rx="112" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="112" fill="url(#glow)"/>

  <!-- soft bottom shadow under the controller -->
  <ellipse cx="256" cy="380" rx="150" ry="18" fill="#0d1240" opacity="0.35"/>

  <!-- controller: central slab + grips, one seamless body -->
  <rect x="96" y="238" width="104" height="76" rx="38" fill="url(#body)"/>
  <rect x="312" y="238" width="104" height="76" rx="38" fill="url(#body)"/>
  <rect x="158" y="178" width="196" height="172" rx="58" fill="url(#body)"/>

  <!-- shoulder notches on the slab top -->
  <rect x="178" y="192" width="56" height="18" rx="9" fill="#b9bfcf"/>
  <rect x="278" y="192" width="56" height="18" rx="9" fill="#b9bfcf"/>

  <!-- d-pad (dark cross, left) -->
  <g fill="url(#dpad)">
    <rect x="180" y="238" width="32" height="66" rx="9"/>
    <rect x="163" y="255" width="66" height="32" rx="9"/>
  </g>

  <!-- center menu buttons -->
  <rect x="240" y="262" width="10" height="20" rx="5" fill="#5a6480"/>
  <rect x="262" y="262" width="10" height="20" rx="5" fill="#5a6480"/>

  <!-- face buttons: ABXY-style colored circles (right) -->
  <circle cx="320" cy="240" r="17" fill="#30d158"/>
  <circle cx="350" cy="270" r="17" fill="#ff453a"/>
  <circle cx="320" cy="300" r="17" fill="#ffd60a"/>
  <circle cx="290" cy="270" r="17" fill="#0a84ff"/>
  <g fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="2">
    <circle cx="320" cy="240" r="14"/>
    <circle cx="350" cy="270" r="14"/>
    <circle cx="320" cy="300" r="14"/>
    <circle cx="290" cy="270" r="14"/>
  </g>
</svg>
